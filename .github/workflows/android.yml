name: Android CI

on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'LICENSE'
      - 'NOTICE'
      - '.github/ISSUE_TEMPLATE/**'
  pull_request:
    branches: [main, 'codex/**']
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'LICENSE'
      - 'NOTICE'
      - '.github/ISSUE_TEMPLATE/**'

permissions:
  contents: read

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check repository privacy
        shell: pwsh
        run: ./tools/check-repository-privacy.ps1

      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1
        with:
          # The action's default still requests the retired legacy `tools`
          # package, which current Android repositories no longer expose.
          packages: platform-tools

      - name: Install Android build tools
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;27.0.12077973" "cmake;3.22.1" "emulator" "system-images;android-35;default;x86_64"

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          cache-read-only: false

      - name: Verify Opus source compatibility
        run: python3 tools/check-opus-compat.py --sdk "$ANDROID_HOME"

      - name: Test, lint, and assemble
        run: >-
          ./gradlew
          quality
          :ts3-protocol:test --rerun
          :audio-opus:testDebugUnitTest --rerun
          :audio-opus:lintDebug
          :app:testDebugUnitTest --rerun
          :app:lintDebug
          :app:lintRelease
          :app:assembleDebug
          :app:assembleRelease
          --max-workers=2
          --no-build-cache
          --stacktrace

      - name: Verify release probes, audio lifecycle, and core UI regressions
        timeout-minutes: 12
        shell: bash
        run: |
          ./gradlew --stop
          sudo chmod 666 /dev/kvm
          export ANDROID_AVD_HOME="$RUNNER_TEMP/release-identity-avd"
          mkdir -p "$ANDROID_AVD_HOME"
          avd_path="$ANDROID_AVD_HOME/release-identity-api35.avd"
          echo no | avdmanager create avd --name release-identity-api35 --path "$avd_path" --package "system-images;android-35;default;x86_64"
          # Explicit registration also covers CLI/emulator versions with different default homes.
          printf 'avd.ini.encoding=UTF-8\npath=%s\ntarget=android-35\n' "$avd_path" > "$ANDROID_AVD_HOME/release-identity-api35.ini"
          "$ANDROID_HOME/emulator/emulator" -list-avds
          cleanup() {
            result=$?
            trap - EXIT
            if [[ "$result" != "0" ]]; then
              cat "$RUNNER_TEMP/release-identity-emulator.log"
              df -h "$RUNNER_TEMP" "$HOME/.android"
            fi
            adb -s emulator-5554 emu kill || echo "::warning::Emulator cleanup failed"
            exit "$result"
          }
          trap cleanup EXIT
          "$ANDROID_HOME/emulator/emulator" -avd release-identity-api35 -port 5554 -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader -partition-size 2048 -memory 2048 -cores 2 > "$RUNNER_TEMP/release-identity-emulator.log" 2>&1 &
          emulator_pid=$!
          attached=false
          for attempt in $(seq 1 90); do
            if ! kill -0 "$emulator_pid" 2>/dev/null; then
              echo "::error::Emulator exited before attaching to ADB"
              exit 1
            fi
            if [[ "$(adb -s emulator-5554 get-state 2>/dev/null)" == "device" ]]; then
              attached=true
              break
            fi
            sleep 2
          done
          if [[ "$attached" != "true" ]]; then
            echo "::error::Emulator did not attach to ADB"
            exit 1
          fi
          booted=false
          for attempt in $(seq 1 90); do
            if [[ "$(adb -s emulator-5554 shell getprop sys.boot_completed | tr -d '\r')" == "1" ]]; then
              booted=true
              break
            fi
            sleep 2
          done
          if [[ "$booted" != "true" ]]; then
            cat "$RUNNER_TEMP/release-identity-emulator.log"
            exit 1
          fi
          pwsh -NoProfile -File ./tools/check-release-identity.ps1 -DeviceSerial emulator-5554 -SdkRoot "$ANDROID_HOME"
          python3 tools/check-release-codec.py --device emulator-5554 --sdk "$ANDROID_HOME"
          python3 -m unittest discover -s tools/tests -p 'test_*.py'
          ./gradlew :audio-opus:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=io.github.ts3mobile.audio.opus.OpusAudioPlayerFocusTest,io.github.ts3mobile.audio.opus.NativeAudioLifecycleTest,io.github.ts3mobile.audio.opus.PlaybackLifecycleTest,io.github.ts3mobile.audio.opus.MicrophonePipelineTest --max-workers=2
          ./gradlew :app:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=io.github.ts3mobile.app.service.MicrophoneControllerTest,io.github.ts3mobile.app.ui.PlaybackFailureTest,io.github.ts3mobile.app.ui.ChatNavigationStateTest,io.github.ts3mobile.app.ui.ChatPanelTest,io.github.ts3mobile.app.ui.PrivateChatPanelTest,io.github.ts3mobile.app.ui.BookmarkEditorTest,io.github.ts3mobile.app.ui.BookmarkListTest,io.github.ts3mobile.app.ui.MicrophoneSettingsTest,io.github.ts3mobile.app.settings.MicrophonePreferenceLifecycleTest,io.github.ts3mobile.app.ui.CurrentConnectionBookmarkTest,io.github.ts3mobile.app.ui.ChannelJoinActionTest,io.github.ts3mobile.app.bookmarks.BookmarkVaultTest,io.github.ts3mobile.app.service.PrivateMessageNotificationsTest,io.github.ts3mobile.app.service.ChatNotificationActivityTest,io.github.ts3mobile.app.ui.ChatNotificationNavigationTest,io.github.ts3mobile.app.service.PokeNotificationsTest,io.github.ts3mobile.app.ui.MicrophoneLevelTest,io.github.ts3mobile.app.service.MicrophoneLevelObserverTest --max-workers=2

      - name: Preserve test and lint reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: android-reports-${{ github.sha }}-${{ github.run_attempt }}
          retention-days: 7
          if-no-files-found: warn
          path: |
            ts3-protocol/build/test-results/test/*.xml
            audio-opus/build/test-results/testDebugUnitTest/*.xml
            app/build/test-results/testDebugUnitTest/*.xml
            audio-opus/build/outputs/androidTest-results/connected/**/*.xml
            app/build/outputs/androidTest-results/connected/**/*.xml
            audio-opus/build/reports/lint-results-*.xml
            app/build/reports/lint-results-*.xml
            ${{ runner.temp }}/release-identity-emulator.log
